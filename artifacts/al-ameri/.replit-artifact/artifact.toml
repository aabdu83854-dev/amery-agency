kind = "web"
previewPath = "/"
title = "Al-Ameri Travel Agency"
version = "1.0.0"
id = "artifacts/al-ameri"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21180

[services.development]
run = "pnpm --filter @workspace/al-ameri run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/al-ameri", "run", "build" ]
publicDir = "artifacts/al-ameri/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21180"
BASE_PATH = "/"
